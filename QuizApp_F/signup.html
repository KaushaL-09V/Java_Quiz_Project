<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up – Master Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css" />
</head>

<body class="auth-body">
    <div class="auth-card">
        <h1><i class="fas fa-user-plus"></i> Create account</h1>
        <p class="muted">Client-side signup (stored locally). Replace with a real API when available.</p>

        <form id="signupForm" class="auth-form">
            <label>Username
                <input type="text" name="username" required />
            </label>
            <label>Password
                <input type="password" name="password" minlength="4" required />
            </label>
            <button type="submit" class="btn full">Create account</button>
            <a class="link" href="login.html">Have an account? Login</a>
        </form>

        <div id="signupMsg" class="msg"></div>
    </div>

    <script src="/app.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const form = new FormData(e.currentTarget);
            const username = form.get('username').trim();
            const password = form.get('password').trim();
            const msg = document.getElementById('signupMsg');

            if (createLocalUser(username, password)) {
                msg.className = 'msg success';
                msg.textContent = 'Account created! Redirecting to login…';
                setTimeout(() => window.location.href = 'login.html', 900);
            } else {
                msg.className = 'msg error';
                msg.textContent = 'Username already exists. Choose another.';
            }
        });
    </script>
</body>

</html>
